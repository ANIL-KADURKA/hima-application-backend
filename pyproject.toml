[project]
name = "hima-application-backend"
version = "0.1.0"
description = "Django REST Framework backend for the HIMA application."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<6.0",
    "djangorestframework>=3.16,<4.0",
    "drf-spectacular>=0.28,<1.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.31,<2.0",
    "bandit>=1.8,<2.0",
    "coverage[toml]>=7.8,<8.0",
    "django-stubs[compatible-mypy]>=5.2,<6.0",
    "djangorestframework-stubs[compatible-mypy]>=3.15,<4.0",
    "mypy>=1.15,<2.0",
    "pip-audit>=2.9,<3.0",
    "pre-commit>=4.2,<5.0",
    "pytest>=9.0.3,<10.0",
    "pytest-django>=4.11,<5.0",
    "ruff>=0.11,<1.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "TCH", "ANN"]
ignore = ["ANN401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
include = ["src"]
exclude = ["**/migrations"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
mypy_path = "src"

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src"]
testpaths = ["src"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.bandit]
targets = ["src"]
exclude_dirs = ["migrations"]

[build-system]
requires = ["uv_build>=0.7.0,<0.8.0"]
build-backend = "uv_build"
